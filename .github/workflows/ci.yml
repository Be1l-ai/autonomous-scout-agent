name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no llama-cpp — compiled separately)
        run: |
          pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings structlog beautifulsoup4 \
                      lxml tenacity curl_cffi groq httpx pytest
      - name: Run tests
        run: python -m pytest tests -q
