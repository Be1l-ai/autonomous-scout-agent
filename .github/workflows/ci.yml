name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no llama-cpp — compiled separately)
        run: |
          pip install --upgrade pip
          grep -v -E '^(llama-cpp-python|#)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest
      - name: Run tests
        run: python -m pytest tests -q
